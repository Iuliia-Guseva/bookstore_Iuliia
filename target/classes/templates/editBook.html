<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Edit book</title>
</head>
<body>
    <main class="page-shell">
    <h1>Edit book</h1>
    <div class="form-card">
        <form class="book-form" th:object="${book}" th:action="@{/update/{id}(id=${book.id})}" method="post">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" required />

            <label for="author">Author</label>
            <input type="text" id="author" th:field="*{author}" required />

            <label for="publicationYear">Publication year</label>
            <input type="number" id="publicationYear" th:field="*{publicationYear}" required />

            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" th:field="*{isbn}" required />

            <label for="price">Price</label>
            <input type="number" id="price" th:field="*{price}" min="0" step="0.01" required />

            <label for="category">Category</label>
            <select id="category" name="categoryId" required>
                <option value="">Select category</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"
                        th:selected="${category.id == book.category?.id}"></option>
            </select>

            <button class="button primary-button" type="submit">Save</button>
        </form>
    </div>
    </main>
</body>
</html>
