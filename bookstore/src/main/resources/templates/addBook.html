<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add book</title>
</head>
<body>
    <h1>Add book</h1>
        <div>
        <form th:object="${book}" th:action="@{/save}" method="post">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" required />

            <label for="author">Author</label>
            <input type="text" id="author" th:field="*{author}" required />

            <label for="publicationYear">Publication year</label>
            <input type="number" id="publicationYear" th:field="*{publicationYear}" required />

            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" th:field="*{isbn}" required />

            <label for="price">Price</label>
            <input type="number" id="price" th:field="*{price}" min="0" step="1" required />

            <button type="submit">Save</button>
        </form>
        </div>
</body>
</html>
